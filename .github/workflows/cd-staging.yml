name: Deploy to EC2 (staging, run on EC2)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            PROJECT_DIR=/home/ubuntu/my-fastapi-app
            VENV_DIR=$PROJECT_DIR/venv
            SERVICE_FILE=/etc/systemd/system/my-fastapi-app.service
            
            echo "--- Starting FastAPI Deployment ---"

            # 0. Ensure essential packages are installed (Fixes the 'ensurepip' error)
            echo "Installing/updating necessary system packages..."
            sudo apt update
            # Using -y to accept prompts automatically and combining git install
            sudo apt install -y python3-venv git libpq-dev
            
            # 1. Initialize repository if it doesn't exist
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Repository not found. Cloning fresh copy..."
              sudo rm -rf "$PROJECT_DIR" || true # Use || true to prevent script error if directory doesn't exist
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi
            
            # Navigate to project directory (using quotes for safety)
            cd "$PROJECT_DIR"
            
            # 2. Pull latest changes
            echo "Pulling latest changes from staging..."
            git fetch origin staging
            git reset --hard origin/staging
            
            # 3. Create or update virtual environment
            if [ ! -d "$VENV_DIR" ]; then
              echo "Creating Python virtual environment..."
              python3 -m venv "$VENV_DIR"
            fi
            
            source "$VENV_DIR/bin/activate"
            
            # 4. Install dependencies
            echo "Installing dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # 5. Run Alembic migrations
            echo "Running Alembic upgrade..."
            alembic upgrade head
            
            # 6. Define SystemD Environment Variables (Single line for systemd Environment=)
            # WARNING: Do not add quotes around the entire string, as it prevents secrets from being expanded properly.
            ENV_VARS="DATABASE_URL=${{ secrets.DATABASE_URL }} SYNC_DATABASE_URL=${{ secrets.SYNC_DATABASE_URL }} SECRET_KEY=${{ secrets.SECRET_KEY }} REFRESH_SECRET_KEY=${{ secrets.REFRESH_SECRET_KEY }} ALGORITHM=${{ secrets.ALGORITHM }} TOKEN_EXPIRE_MINUTES=${{ secrets.TOKEN_EXPIRE_MINUTES }} REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}"
            
            # 7. Create/Update SystemD service file
            echo "Writing systemd service file to $SERVICE_FILE..."
            sudo bash -c "cat > $SERVICE_FILE" <<EOL

            # 8. Manage and restart service
            echo "Reloading systemd and restarting service..."
            sudo systemctl daemon-reload
            sudo systemctl enable my-fastapi-app.service || true # Use || true in case it's already enabled
            sudo systemctl restart my-fastapi-app.service
            
            # Check the status of the service (optional but useful for debugging)
            sudo systemctl status my-fastapi-app.service --no-pager
            
            echo "✅ Deployment completed successfully!"
