name: Deploy to EC2 (staging, run on EC2)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            PROJECT_DIR=/home/ubuntu/my-fastapi-app
            VENV_DIR=$PROJECT_DIR/venv
            SERVICE_FILE=/etc/systemd/system/my-fastapi-app.service

            # 1️⃣ Clone repo if it doesn't exist
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              sudo rm -rf $PROJECT_DIR
              git clone https://github.com/${{ github.repository }}.git $PROJECT_DIR
            fi

            cd $PROJECT_DIR

            # 2️⃣ Pull latest changes from staging
            git fetch origin staging
            git reset --hard origin/staging

            # 3️⃣ Create or update virtual environment
            if [ ! -d "$VENV_DIR" ]; then
              python3 -m venv $VENV_DIR
            fi
            source $VENV_DIR/bin/activate

            # 4️⃣ Upgrade pip and install dependencies
            pip install --upgrade pip
            pip install -r requirements.txt

            # 5️⃣ Run Alembic migrations
            alembic upgrade head

            # 6️⃣ Export environment variables directly for systemd
            ENV_VARS="DATABASE_URL=${{ secrets.DATABASE_URL }}
            SYNC_DATABASE_URL=${{ secrets.SYNC_DATABASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            REFRESH_SECRET_KEY=${{ secrets.REFRESH_SECRET_KEY }}
            ALGORITHM=${{ secrets.ALGORITHM }}
            TOKEN_EXPIRE_MINUTES=${{ secrets.TOKEN_EXPIRE_MINUTES }}
            REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}"

            # 7️⃣ Create systemd service file with environment variables
            sudo bash -c "cat > $SERVICE_FILE" <<EOL
          [Unit]
          Description=My FastAPI App
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=$PROJECT_DIR
          Environment=$ENV_VARS
          ExecStart=$VENV_DIR/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOL

            # Reload systemd, enable service, and restart
            sudo systemctl daemon-reload
            sudo systemctl enable my-fastapi-app.service
            sudo systemctl restart my-fastapi-app.service
            sudo systemctl status my-fastapi-app.service --no-pager

            echo "✅ Deployment with Alembic migrations completed successfully!"
