name: Deploy to EC2 (staging, run on EC2)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Expose GitHub Secrets as environment variables for systemd and Alembic
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SYNC_DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      TOKEN_EXPIRE_MINUTES: ${{ secrets.TOKEN_EXPIRE_MINUTES }}
      REFRESH_SECRET_KEY: ${{ secrets.REFRESH_SECRET_KEY }}
      REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            PROJECT_DIR=/home/ubuntu/my-fastapi-app
            VENV_DIR=$PROJECT_DIR/venv
            SERVICE_FILE=/etc/systemd/system/my-fastapi-app.service
            
            echo "--- Starting FastAPI Deployment ---"

            # 0. Install system packages (Python dev headers, PostgreSQL headers, compiler)
            sudo apt update
            sudo apt install -y \
                python3.12-venv \
                python3.12-dev \
                git \
                libpq-dev \
                build-essential

            # 1. Initialize repository if it doesn't exist
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Repository not found. Cloning fresh copy..."
              sudo rm -rf "$PROJECT_DIR" || true
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi
            
            cd "$PROJECT_DIR"
            
            # 2. Pull latest changes from staging
            git fetch origin staging
            git reset --hard origin/staging
            
            # 3. Create or update virtual environment
            if [ ! -d "$VENV_DIR" ]; then
              echo "Creating Python virtual environment..."
              python3.12 -m venv "$VENV_DIR"
            fi
            
            source "$VENV_DIR/bin/activate"
            
            # 4. Upgrade pip and install dependencies
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Optional: Use psycopg2-binary if you want precompiled wheel
            # pip install psycopg2-binary
            
            # 5. Run Alembic migrations
            alembic upgrade head
            
            # 6. Create SystemD service file
            echo "Writing systemd service file to $SERVICE_FILE..."
            sudo bash -c "cat > $SERVICE_FILE" <<EOL
            [Unit]
            Description=FastAPI App
            After=network.target

            [Service]
            User=ubuntu
            Group=ubuntu
            WorkingDirectory=$PROJECT_DIR
            Environment="DATABASE_URL=${DATABASE_URL}"
            Environment="SYNC_DATABASE_URL=${SYNC_DATABASE_URL}"
            Environment="SECRET_KEY=${SECRET_KEY}"
            Environment="REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY}"
            Environment="ALGORITHM=${ALGORITHM}"
            Environment="TOKEN_EXPIRE_MINUTES=${TOKEN_EXPIRE_MINUTES}"
            Environment="REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}"
            ExecStart=$VENV_DIR/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOL

            # 7. Reload and restart service
            sudo systemctl daemon-reload
            sudo systemctl enable my-fastapi-app.service || true
            sudo systemctl restart my-fastapi-app.service
            
            sudo systemctl status my-fastapi-app.service --no-pager
            
            echo "✅ Deployment completed successfully!"
