name: Deploy to EC2 (staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,SYNC_DATABASE_URL,SECRET_KEY,REFRESH_SECRET_KEY,ALGORITHM,TOKEN_EXPIRE_MINUTES,REFRESH_TOKEN_EXPIRE_DAYS,GITHUB_REPOSITORY
          script: |-
            set -e

            PROJECT_DIR=/home/ubuntu/my-fastapi-app
            VENV_DIR=$PROJECT_DIR/venv
            SERVICE_FILE=/etc/systemd/system/my-fastapi-app.service

            echo "--- Starting FastAPI Deployment ---"

            # 0️⃣ Install system packages for Python 3.12 + PostgreSQL
            sudo apt update
            sudo apt install -y python3.12-venv python3.12-dev git libpq-dev build-essential

            # 1️⃣ Clone repository if missing
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Cloning repository..."
              sudo rm -rf "$PROJECT_DIR" || true
              git clone https://github.com/$GITHUB_REPOSITORY.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            
            # Print environment variables after cd
            echo "===== CHECKING ENV VARS IN PROJECT DIR ====="
            echo "DATABASE_URL: $DATABASE_URL"
            echo "SYNC_DATABASE_URL: $SYNC_DATABASE_URL"
            echo "SECRET_KEY: $SECRET_KEY"
            echo "REFRESH_SECRET_KEY: $REFRESH_SECRET_KEY"
            echo "ALGORITHM: $ALGORITHM"
            echo "TOKEN_EXPIRE_MINUTES: $TOKEN_EXPIRE_MINUTES"
            echo "REFRESH_TOKEN_EXPIRE_DAYS: $REFRESH_TOKEN_EXPIRE_DAYS"
            echo "============================================="

            # 2️⃣ Pull latest staging branch
            git fetch origin staging
            git checkout staging || git checkout -b staging
            git reset --hard origin/staging

            # 3️⃣ Create virtualenv if missing
            if [ ! -d "$VENV_DIR" ]; then
              python3.12 -m venv "$VENV_DIR"
            fi
            source "$VENV_DIR/bin/activate"

            # 4️⃣ Upgrade pip & install dependencies
            pip install --upgrade pip
            pip install -r requirements.txt

            # 5️⃣ Validate and export environment variables
            if [ -z "$DATABASE_URL" ]; then
              echo "❌ DATABASE_URL must be set"
              exit 1
            fi
            if [ -z "$SYNC_DATABASE_URL" ]; then
              echo "❌ SYNC_DATABASE_URL must be set"
              exit 1
            fi
            if [ -z "$SECRET_KEY" ]; then
              echo "❌ SECRET_KEY must be set"
              exit 1
            fi
            if [ -z "$REFRESH_SECRET_KEY" ]; then
              echo "❌ REFRESH_SECRET_KEY must be set"
              exit 1
            fi
            if [ -z "$ALGORITHM" ]; then
              echo "❌ ALGORITHM must be set"
              exit 1
            fi
            
            # Set defaults for optional variables
            TOKEN_EXPIRE_MINUTES="${TOKEN_EXPIRE_MINUTES:-30}"
            REFRESH_TOKEN_EXPIRE_DAYS="${REFRESH_TOKEN_EXPIRE_DAYS:-7}"
            
            # Export all environment variables so they're available to subprocesses
            export DATABASE_URL
            export SYNC_DATABASE_URL
            export SECRET_KEY
            export REFRESH_SECRET_KEY
            export ALGORITHM
            export TOKEN_EXPIRE_MINUTES
            export REFRESH_TOKEN_EXPIRE_DAYS

            # 5️⃣a Print environment variables (for debugging)
            echo "===== ENVIRONMENT VARIABLES ====="
            echo "DATABASE_URL length: ${#DATABASE_URL}"
            echo "DATABASE_URL first 20 chars: ${DATABASE_URL:0:20}"
            echo "SYNC_DATABASE_URL length: ${#SYNC_DATABASE_URL}"
            echo "SYNC_DATABASE_URL first 20 chars: ${SYNC_DATABASE_URL:0:20}"
            echo "SECRET_KEY length: ${#SECRET_KEY}"
            echo "REFRESH_SECRET_KEY length: ${#REFRESH_SECRET_KEY}"
            echo "ALGORITHM: $ALGORITHM"
            echo "TOKEN_EXPIRE_MINUTES: $TOKEN_EXPIRE_MINUTES"
            echo "REFRESH_TOKEN_EXPIRE_DAYS: $REFRESH_TOKEN_EXPIRE_DAYS"
            echo "================================="

            # 6️⃣ Run Alembic migrations
            echo "Running database migrations..."
            echo "DEBUG: About to run Alembic with DATABASE_URL length: ${#DATABASE_URL}"
            echo "DEBUG: DATABASE_URL value: $DATABASE_URL"
            
            alembic upgrade head || {
              echo "❌ Alembic migration failed!"
              exit 1
            }

            # 7️⃣ Create/update systemd service file
            echo "Writing systemd service file..."
            sudo bash -c "cat > $SERVICE_FILE <<EOL
            [Unit]
            Description=FastAPI App
            After=network.target

            [Service]
            User=ubuntu
            Group=ubuntu
            WorkingDirectory=$PROJECT_DIR
            Environment=\"DATABASE_URL=$DATABASE_URL\"
            Environment=\"SYNC_DATABASE_URL=$SYNC_DATABASE_URL\"
            Environment=\"SECRET_KEY=$SECRET_KEY\"
            Environment=\"REFRESH_SECRET_KEY=$REFRESH_SECRET_KEY\"
            Environment=\"ALGORITHM=$ALGORITHM\"
            Environment=\"TOKEN_EXPIRE_MINUTES=$TOKEN_EXPIRE_MINUTES\"
            Environment=\"REFRESH_TOKEN_EXPIRE_DAYS=$REFRESH_TOKEN_EXPIRE_DAYS\"
            ExecStart=$VENV_DIR/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOL"

            # 8️⃣ Reload systemd & restart service
            sudo systemctl daemon-reload
            sudo systemctl enable my-fastapi-app.service || true
            sudo systemctl restart my-fastapi-app.service || {
              echo "❌ Service restart failed!"
              sudo systemctl status my-fastapi-app.service --no-pager
              exit 1
            }

            sudo systemctl status my-fastapi-app.service --no-pager

            echo "✅ Deployment completed successfully!"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          REFRESH_SECRET_KEY: ${{ secrets.REFRESH_SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          TOKEN_EXPIRE_MINUTES: ${{ secrets.TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
          GITHUB_REPOSITORY: ${{ github.repository }}