name: Staging Deploy

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # Step 2: Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Step 3: Build and push Docker image
      - name: Build and push Docker image
        run: |
          LOWERCASE_USERNAME=$(echo "${{ secrets.GHCR_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=ghcr.io/$LOWERCASE_USERNAME/my-fastapi-app:staging
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      # Step 4: SSH into EC2 and deploy Docker image
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop myapp || true
            docker rm myapp || true
            docker pull ghcr.io/$LOWERCASE_USERNAME/my-fastapi-app:staging
            docker run -d --name myapp -p 8000:8000 ghcr.io/$LOWERCASE_USERNAME/my-fastapi-app:staging
