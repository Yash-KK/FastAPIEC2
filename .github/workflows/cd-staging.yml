name: Deploy to EC2 (staging)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_DATABASE_URL: ${{ secrets.SYNC_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          REFRESH_SECRET_KEY: ${{ secrets.REFRESH_SECRET_KEY }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          TOKEN_EXPIRE_MINUTES: ${{ secrets.TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |-
            set -e
            
            PROJECT_DIR=/home/ubuntu/my-fastapi-app
            VENV_DIR=$PROJECT_DIR/venv
            SERVICE_FILE=/etc/systemd/system/my-fastapi-app.service

            echo "--- Starting FastAPI Deployment ---"

            # 0️⃣ Install system packages for Python 3.12 + PostgreSQL
            sudo apt update
            sudo apt install -y \
                python3.12-venv \
                python3.12-dev \
                git \
                libpq-dev \
                build-essential

            # 1️⃣ Clone repository if missing
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Cloning repository..."
              sudo rm -rf "$PROJECT_DIR" || true
              git clone https://github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # 2️⃣ Pull latest staging branch
            git fetch origin staging
            git checkout staging || git checkout -b staging
            git reset --hard origin/staging

            # 3️⃣ Create virtualenv if missing
            if [ ! -d "$VENV_DIR" ]; then
              python3.12 -m venv "$VENV_DIR"
            fi
            source "$VENV_DIR/bin/activate"

            # 4️⃣ Upgrade pip & install dependencies
            pip install --upgrade pip
            pip install -r requirements.txt

            # 5️⃣ Validate environment variables
            : "${DATABASE_URL:?❌ DATABASE_URL must be set}"
            : "${SYNC_DATABASE_URL:?❌ SYNC_DATABASE_URL must be set}"
            : "${SECRET_KEY:?❌ SECRET_KEY must be set}"
            : "${REFRESH_SECRET_KEY:?❌ REFRESH_SECRET_KEY must be set}"
            : "${ALGORITHM:?❌ ALGORITHM must be set}"
            : "${TOKEN_EXPIRE_MINUTES:=30}"
            : "${REFRESH_TOKEN_EXPIRE_DAYS:=7}"

            export DATABASE_URL
            export SYNC_DATABASE_URL
            export SECRET_KEY
            export REFRESH_SECRET_KEY
            export ALGORITHM
            export TOKEN_EXPIRE_MINUTES
            export REFRESH_TOKEN_EXPIRE_DAYS

            # Optional debug (safe values only)
            echo "TOKEN_EXPIRE_MINUTES=$TOKEN_EXPIRE_MINUTES"
            echo "REFRESH_TOKEN_EXPIRE_DAYS=$REFRESH_TOKEN_EXPIRE_DAYS"

            # 6️⃣ Run Alembic migrations
            echo "Running database migrations..."
            alembic upgrade head || {
              echo "❌ Migration failed!"
              exit 1
            }

            # 7️⃣ Create/update systemd service file
            echo "Writing systemd service file..."
            sudo bash -c "cat > $SERVICE_FILE" <<EOL
            [Unit]
            Description=FastAPI App
            After=network.target

            [Service]
            User=ubuntu
            Group=ubuntu
            WorkingDirectory=$PROJECT_DIR
            Environment="DATABASE_URL=$DATABASE_URL"
            Environment="SYNC_DATABASE_URL=$SYNC_DATABASE_URL"
            Environment="SECRET_KEY=$SECRET_KEY"
            Environment="REFRESH_SECRET_KEY=$REFRESH_SECRET_KEY"
            Environment="ALGORITHM=$ALGORITHM"
            Environment="TOKEN_EXPIRE_MINUTES=$TOKEN_EXPIRE_MINUTES"
            Environment="REFRESH_TOKEN_EXPIRE_DAYS=$REFRESH_TOKEN_EXPIRE_DAYS"
            ExecStart=$VENV_DIR/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOL

            # 8️⃣ Reload systemd & start service
            sudo systemctl daemon-reload
            sudo systemctl enable my-fastapi-app.service || true
            sudo systemctl restart my-fastapi-app.service || {
              echo "❌ Service restart failed!"
              sudo systemctl status my-fastapi-app.service --no-pager
              exit 1
            }
            sudo systemctl status my-fastapi-app.service --no-pager

            echo "✅ Deployment completed successfully!"
