name: Deploy to EC2 (build on EC2)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            PROJECT_DIR=/home/ubuntu/my-fastapi-app

            # Check if directory exists and is a valid git repo
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Recreating project directory..."
              rm -rf $PROJECT_DIR
              git clone https://github.com/${{ github.repository }}.git $PROJECT_DIR
            fi

            cd $PROJECT_DIR

            # Pull latest from staging branch
            git fetch origin staging
            git reset --hard origin/staging

            # Stop and rebuild Docker container
            docker stop myapp || true
            docker rm myapp || true
            docker build -t my-fastapi-app:staging .
            docker run -d --name myapp -p 8000:8000 my-fastapi-app:staging
