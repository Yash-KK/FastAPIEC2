name: Dev Branch CI

# Trigger CI whenever code is pushed to the dev branch
on:
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python 3.13 (match your local)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Step 4: Run simple test
      - name: Run Hello World Test
        run: |
          python -c "from app.main import app; print('Hello World Test Passed')"
